name: Private read gateway offline validation
on:
  pull_request:
    paths:
      - 'src/ci_broker/**'
      - 'tests/**'
      - '.github/workflows/private-read-validation.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install package metadata
        run: |
          python3 -m venv --system-site-packages /tmp/broker-test-venv
          /tmp/broker-test-venv/bin/python -m pip install --no-build-isolation --no-deps -e .
      - name: Offline contracts and syntax
        run: |
          /tmp/broker-test-venv/bin/python --version
          PYTHONPATH=src /tmp/broker-test-venv/bin/python -m unittest discover -s tests -v
          /tmp/broker-test-venv/bin/python -m compileall -q src tests
          /tmp/broker-test-venv/bin/python -m ci_broker.gateway_cli observe --help
