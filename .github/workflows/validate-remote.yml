name: CI Broker remote validation (public free runner)

on:
  push:
    branches:
      - feature/circleci-remote-cli-20261104

permissions:
  contents: read

concurrency:
  group: ci-broker-remote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.15.2']
    env:
      CIRCLECI_TOKEN: ''
      CI_BROKER_GITHUB_TOKEN: ''
      CI_BROKER_WEBHOOK_SECRET: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source and interpreter
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python --version
          python -m pip install -e .
      - name: Run complete offline acceptance (no external CI dispatch)
        run: |
          set -euo pipefail
          PYTHON=python bash scripts/validate_local.sh
      - name: Smoke remote CLI and webhook in help-only mode
        run: |
          set -euo pipefail
          ci-broker remote --help
          ci-broker webhook --help
          ci-broker-remote --help
          ci-broker-webhook --help
          python -c 'import ci_broker.remote, ci_broker.webhook; print("REMOTE_IMPORT_PASS")'
