[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agnostic-ci-broker"
version = "0.1.1"
description = "Project-agnostic local-first CI planning and shared budget accounting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CI Broker contributors"}]
dependencies = []

[project.scripts]
ci-broker = "ci_broker.cli:main"
ci-broker-remote = "ci_broker.remote:main"
ci-broker-mcp = "ci_broker.mcp_server:main"
ci-broker-webhook = "ci_broker.webhook:main"

[project.optional-dependencies]
mcp = ["mcp>=1,<3"]

[project.entry-points."ci_broker.providers"]
# Third-party packages may register trusted ProviderAdapter factories here.
github-actions = "ci_broker.plugins.github_actions:GitHubActionsReader"

[tool.setuptools.packages.find]
where = ["src"]
